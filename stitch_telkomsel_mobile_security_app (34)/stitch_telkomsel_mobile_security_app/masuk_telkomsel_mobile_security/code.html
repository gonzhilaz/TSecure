<body class="bg-slate-bg text-navy-dark min-h-screen flex items-center justify-center p-0 select-none">

<div class="flex flex-col">

<div class="mt-6">
<label class="block text-xs font-medium text-gray-500 mb-2" for="phone-input">

          </label>

<div class="flex items-center w-full h-14 bg-white border border-gray-200 rounded-2xl px-3.5 gap-2.5 transition-all focus-within:border-brand-red focus-within:ring-2 focus-within:ring-red-500/15">

<div class="flex items-center gap-2 pl-0.5 shrink-0 select-none">

<div class="h-1/2 w-full bg-white"></div>
</div>

</div>
<!-- Vertical Divider -->
<div class="w-[1px] h-6 bg-gray-200 mx-1 shrink-0"></div>
<!-- Number Input Field -->
<input autocomplete="tel-national" class="flex-1 bg-transparent border-0 outline-none text-[15px] font-semibold text-navy-dark placeholder:text-gray-400 focus:ring-0 focus:outline-none tracking-wide px-1" id="phone-input" maxlength="16" placeholder="812-3456-7890" type="tel" value="812-3456-7890">

<div class="flex items-start gap-3 mt-4">
<label class="relative flex items-center justify-center cursor-pointer mt-0.5 shrink-0">
<input checked="" class="sr-only" type="checkbox">
<div class="w-5 h-5 rounded-md bg-brand-red flex items-center justify-center text-white shadow-xs">
<span class="material-symbols-outlined text-[15px] font-bold">check</span>
</div>
</label>
<p class="text-xs text-gray-600 leading-snug">
              Saya menyetujui <a class="text-brand-red font-medium underline underline-offset-2" href="javascript:void(0)">Ketentuan Layanan</a> &amp; <a class="text-brand-red font-medium underline underline-offset-2" href="javascript:void(0)">Kebijakan Privasi</a> Telkomsel (UU PDP No. 27/2022)
            </p>
</div>
</div>
</div>

<div class="flex flex-col mt-auto pt-4">
<!-- CTA Submit Button -->
<a class="w-full py-3.5 bg-brand-red hover:bg-brand-red-dark active:bg-brand-red-dark text-white font-semibold rounded-2xl shadow-lg shadow-red-500/20 text-center text-base transition-all flex items-center justify-center gap-2 active:scale-[0.99]" href="{{DATA:SCREEN:SCREEN_25}}">
<span class="">Masuk</span>
<span class="material-symbols-outlined text-[19px]">arrow_forward</span>
</a>
<!-- Network Security Badge Note -->
<div class="flex items-center justify-center gap-1.5 mt-3.5">
<span class="text-[11px] font-normal text-gray-500 text-center">
            Autentikasi Instan Jaringan Telkomsel • Tanpa Kode OTP
          </span>
</div>
<!-- Help & Contact Text -->
<div class="text-center mt-2 px-2">
<p class="text-xs text-gray-400 leading-normal">
            Masuk instan tanpa OTP. Butuh bantuan? Hubungi <a class="text-gray-600 font-medium hover:underline" href="tel:188">GraPARI 188</a> atau <a class="text-brand-red font-medium hover:underline" href="javascript:void(0)">Veronika</a>
</p>
</div>
<!-- iOS Home Indicator -->
<div class="w-32 h-1 bg-navy-dark/80 rounded-full mx-auto mt-4 shrink-0"></div>
</div>
</section>
</main>
